<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Central de Clima Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(rgba(6, 11, 25, 0.92), rgba(6, 11, 25, 0.96)), url('https://images.unsplash.com/photo-1501630834273-4b5604d2ee31?q=80&w=1600&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #fff;
  min-height: 100vh;
}
.header {
  text-align: center;
  padding: 2rem 1rem;
  background: rgba(0, 0, 0, 0.3);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
.header h1 {
  margin: 0 0 0.5rem 0;
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.search-container {
  display: flex;
  gap: 10px;
  max-width: 500px;
  margin: 1.5rem auto 0;
}
.search-input {
  flex: 1;
  padding: 12px 20px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(0, 0, 0, 0.4);
  color: #fff;
  font-size: 1rem;
}
.search-btn {
  padding: 12px 24px;
  border-radius: 8px;
  border: none;
  background: #3b82f6;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.search-btn:hover { background: #2563eb; }
.main-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 2rem;
}
@media(min-width: 900px) {
  .main-container { grid-template-columns: 350px 1fr; }
}
.panel {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 1.5rem;
  backdrop-filter: blur(10px);
}
.consensus-box {
  text-align: center;
  padding: 2rem 0;
}
.consensus-title {
  font-size: 1.1rem;
  color: #94a3b8;
  margin-bottom: 0.5rem;
}
.consensus-temp {
  font-size: 5rem;
  font-weight: 700;
  line-height: 1;
  background: linear-gradient(to right, #60a5fa, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 1rem;
}
.location-name { font-size: 1.2rem; font-weight: 500; }
#map {
  width: 100%;
  height: 250px;
  border-radius: 12px;
  margin-top: 1.5rem;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.apis-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
}
.api-card {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 1.2rem;
}
.api-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.api-temp {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}
.api-detail {
  font-size: 0.9rem;
  color: #cbd5e1;
  margin-bottom: 4px;
}
.loading {
  text-align: center;
  padding: 4rem;
  font-size: 1.2rem;
  color: #94a3b8;
}
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  background: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Central de Clima Pro</h1>
  <p style="color:#94a3b8; margin:0;">Análisis y consolidación matemática de fuentes</p>
  <div class="search-container">
    <input type="text" id="cityInput" class="search-input" placeholder="Ej: San Luis, Argentina" onkeypress="if(event.key === 'Enter') searchCity()" />
    <button class="search-btn" onclick="searchCity()">Buscar</button>
  </div>
</div>

<div class="main-container" id="content">
  <div class="loading">Ingresa una ciudad para analizar el clima...</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  lucide.createIcons();
  let mapInstance = null;

  async function searchCity() {
    const city = document.getElementById("cityInput").value;
    if (!city) return;
    
    document.getElementById("content").innerHTML = '<div class="loading">Consultando satélites y modelos...</div>';
    
    try {
      const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
      const geoData = await geoRes.json();
      
      if (!geoData || geoData.length === 0) {
        document.getElementById("content").innerHTML = '<div class="loading">No se encontró la ciudad.</div>';
        return;
      }
      
      const lat = geoData[0].lat;
      const lon = geoData[0].lon;
      const displayName = geoData[0].display_name.split(',')[0];
      
      fetchWeather(lat, lon, displayName);
    } catch (e) {
      document.getElementById("content").innerHTML = '<div class="loading">Error en la búsqueda geográfica.</div>';
    }
  }

  async function fetchWeather(lat, lon, cityName) {
    try {
      const res = await fetch(`/api/weather?lat=${lat}&lon=${lon}&city=${encodeURIComponent(cityName)}`);
      const data = await res.json();
      
      renderUI(data);
    } catch (e) {
      document.getElementById("content").innerHTML = '<div class="loading">Error al contactar el servidor.</div>';
    }
  }

  function renderUI(data) {
    const html = `
      <div class="panel">
        <div class="consensus-box">
          <div class="consensus-title">CONSENSO PONDERADO</div>
          <div class="consensus-temp">${data.consensus ?? "--"} &deg;C</div>
          <div class="location-name">${data.location.name}</div>
          <div class="badge">Nivel de confianza: ${data.confidence.toUpperCase()}</div>
        </div>
        <div id="map"></div>
      </div>
      
      <div class="panel">
        <h2 style="margin-top:0; margin-bottom: 1.5rem; font-size: 1.2rem;">Fuentes Analizadas</h2>
        <div class="apis-grid" id="apis"></div>
      </div>
    `;
    
    document.getElementById("content").innerHTML = html;
    
    // Inicializar Mapa
    setTimeout(() => {
      if (mapInstance) { mapInstance.remove(); }
      mapInstance = L.map('map').setView([data.location.lat, data.location.lon], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(mapInstance);
      L.circleMarker([data.location.lat, data.location.lon], {
        radius: 8, fillColor: "#3b82f6", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.8
      }).addTo(mapInstance);
    }, 100);

    // Renderizar Tarjetas
    const container = document.getElementById("apis");
    const names = { openweather: "OpenWeather", openmeteo: "Open-Meteo", metno: "MET Norway" };
    
    // Modelos
    for (const key in data.models.sources) {
      const s = data.models.sources[key];
      let icon = "cloud";
      if (key === 'openweather') icon = "sun";
      if (key === 'metno') icon = "wind";

      container.innerHTML += `
        <div class="api-card">
          <div class="api-title">
            <span>${names[key]}</span>
            <i data-lucide="${icon}" style="width:18px; color:#60a5fa;"></i>
          </div>
          <div class="api-temp">${s.temp !== undefined ? s.temp : "-"} &deg;C</div>
          ${s.humidity ? `<div class="api-detail">Humedad: ${s.humidity}%</div>` : ''}
          ${s.wind ? `<div class="api-detail">Viento: ${s.wind} m/s</div>` : ''}
        </div>
      `;
    }

    // Observación METAR
    if (data.observation.metar.temp !== undefined) {
      container.innerHTML += `
        <div class="api-card" style="border-color: #3b82f6;">
          <div class="api-title">
            <span style="color:#3b82f6;">METAR (Observación)</span>
            <i data-lucide="plane" style="width:18px; color:#3b82f6;"></i>
          </div>
          <div class="api-temp">${data.observation.metar.temp} &deg;C</div>
          <div class="api-detail">Estación: ${data.observation.metar.station}</div>
          <div class="api-detail">${data.observation.metar.note}</div>
        </div>
      `;
    }
    lucide.createIcons();
  }

  // Auto-cargar San Luis al iniciar para probar el MVP rápido
  window.onload = () => fetchWeather(-33.295, -66.335, "San Luis, Argentina");
</script>
</body>
</html>

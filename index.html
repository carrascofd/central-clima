<script>
const DEG = "\u00B0";

function render(data) {

  document.getElementById("temp").textContent =
    data.consensus != null ? `${data.consensus} ${DEG}C` : `-- ${DEG}C`;

  document.getElementById("confidence").textContent =
    "Confianza: " + data.confidence;

  document.getElementById("avg").textContent =
    "Promedio modelos: " + (data.models.average ?? "-") + ` ${DEG}C`;

  const container = document.getElementById("apis");
  container.innerHTML = "";

  for (const key in data.models.sources) {
    const s = data.models.sources[key];

    container.innerHTML += `
      <div class="api-card">
        <b>${key}</b><br>
        ${s.temp ?? "-"} ${DEG}C
      </div>`;
  }

  container.innerHTML += `
    <div class="api-card">
      <b>SMN</b><br>
      ${data.observation.smn.temp ?? "-"} ${DEG}C<br>
      ${data.observation.smn.station}
    </div>
  `;

  container.innerHTML += `
    <div class="api-card">
      <b>METAR</b><br>
      ${data.observation.metar.temp ?? "-"} ${DEG}C<br>
      ${data.observation.metar.station}
    </div>
  `;
}
</script>

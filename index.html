<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Central de Clima</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; background:#0f172a; color:white; }
.header { display:flex; justify-content:center; gap:10px; padding:20px; }
input, button { padding:10px; border-radius:8px; border:none; }
button { background:#3b82f6; color:white; cursor:pointer; }

.container { max-width:1100px; margin:auto; }

.main-card {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.grid {
  display:grid;
  grid-template-columns: 2fr 1fr;
  gap:20px;
}

#map { height:250px; border-radius:12px; }

.api-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:15px;
}

.api-card {
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.ok { color:#22c55e; }
.error { color:#ef4444; }
.nodata { color:#facc15; }
</style>
</head>

<body>

<div class="header">
  <input id="city" placeholder="Ciudad"/>
  <button onclick="buscar()">Consultar</button>
</div>

<div class="container">

  <div class="main-card">
    <h1 id="temp">-- °„C</h1>
    <p id="confidence"></p>
  </div>

  <div class="grid">
    <div class="main-card">
      <p id="avg"></p>
    </div>
    <div id="map"></div>
  </div>

  <div class="api-grid" id="apis"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map, marker;

function initMap(lat, lon) {
  if (!map) {
    map = L.map('map').setView([lat, lon], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    marker = L.marker([lat, lon]).addTo(map);
  } else {
    map.setView([lat, lon], 10);
    marker.setLatLng([lat, lon]);
  }
}

window.onload = () => {
  navigator.geolocation.getCurrentPosition(pos => {
    cargar(pos.coords.latitude, pos.coords.longitude);
  });
};

function buscar() {
  const city = document.getElementById("city").value;
  fetch(`/api/weather?city=${city}`).then(r=>r.json()).then(render);
}

function cargar(lat, lon) {
  fetch(`/api/weather?lat=${lat}&lon=${lon}`)
    .then(r=>r.json())
    .then(d=>{
      render(d);
      initMap(lat, lon);
    });
}

function render(data) {

  document.getElementById("temp").textContent =
    data.consensus != null ? `${data.consensus} °„C` : "-- °„C";

  document.getElementById("confidence").textContent =
    "Confianza: " + data.confidence;

  document.getElementById("avg").textContent =
    "Promedio modelos: " + (data.models.average ?? "-") + " °„C";

  const container = document.getElementById("apis");
  container.innerHTML = "";

  for (const key in data.models.sources) {
    const s = data.models.sources[key];

    container.innerHTML += `
      <div class="api-card">
        <b>${key}</b><br>
        ${s.temp ?? "-"} °„C
      </div>`;
  }

  container.innerHTML += `
    <div class="api-card">
      <b>SMN</b><br>
      ${data.observation.smn.temp ?? "-"} °„C<br>
      ${data.observation.smn.station}
    </div>
  `;

  container.innerHTML += `
    <div class="api-card">
      <b>METAR</b><br>
      ${data.observation.metar.temp ?? "-"} °„C<br>
      ${data.observation.metar.station}
    </div>
  `;
}
</script>

</body>
</html>

<script>
function render(data) {

  if (!data) return;

  // -----------------------------
  // TEMPERATURA PRINCIPAL
  // -----------------------------
  document.getElementById("temp").innerHTML =
    data.consensus != null ? `${data.consensus} &deg;C` : "-- &deg;C";

  document.getElementById("confidence").innerText =
    `Confianza: ${data.confidence ?? "-"}`;

  document.getElementById("avg").innerHTML =
    `Modelo promedio: ${data.models?.average ?? "-"} &deg;C`;

  // -----------------------------
  // CONTEO FUENTES
  // -----------------------------
  const modelSources = data.models?.sources || {};

  const activeModels = Object.values(modelSources)
    .filter(s => s && s.temp != null).length;

  document.getElementById("sources").innerText =
    `Modelos activos: ${activeModels}`;

  // -----------------------------
  // RENDER APIs
  // -----------------------------
  const container = document.getElementById("apis");
  container.innerHTML = "";

  const names = {
    openmeteo: "Open-Meteo",
    metno: "Met.no",
    openweather: "OpenWeather"
  };

  // ?? MODELOS
  for (const key in modelSources) {
    const s = modelSources[key];

    container.innerHTML += `
      <div class="api-card">
        <h3>${names[key] || key} (modelo)</h3>
        <p>${s?.temp != null ? s.temp + " &deg;C" : "-"}</p>
      </div>
    `;
  }

  // ?? SMN
  const smn = data.observation?.smn;

  container.innerHTML += `
    <div class="api-card">
      <h3>SMN (observaci¨®n real)</h3>
      <p>${smn?.temp != null ? smn.temp + " &deg;C" : "-"}</p>
      <p>${smn?.station ?? ""}</p>
    </div>
  `;

  // ?? METEOSTAT
  const meteostat = data.extra?.meteostat;

  container.innerHTML += `
    <div class="api-card">
      <h3>Meteostat</h3>
      <p>${meteostat?.desc ?? "Sin datos"}</p>
    </div>
  `;
}
</script>

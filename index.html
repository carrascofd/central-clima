<!-- SOLO CAMBIA LA FUNCI¨®N render() -->

<script>
function render(data) {

  document.getElementById("temp").innerHTML =
    data.consensus != null ? `${data.consensus} &deg;C` : "-- &deg;C";

  document.getElementById("confidence").innerText =
    `Confianza: ${data.confidence}`;

  document.getElementById("avg").innerHTML =
    `Modelo promedio: ${data.models.average ?? "-"} &deg;C`;

  document.getElementById("sources").innerText =
    `Modelos activos: ${Object.values(data.models.sources).filter(s => s.temp != null).length}`;

  const container = document.getElementById("apis");
  container.innerHTML = "";

  // ?? MODELOS
  for (const key in data.models.sources) {
    const s = data.models.sources[key];

    container.innerHTML += `
      <div class="api-card">
        <h3>${key.toUpperCase()} (modelo)</h3>
        <p>${s.temp ?? "-"} &deg;C</p>
      </div>
    `;
  }

  // ?? SMN
  container.innerHTML += `
    <div class="api-card">
      <h3>SMN (observaci¨®n real)</h3>
      <p>${data.observation.smn.temp ?? "-"} &deg;C</p>
      <p>${data.observation.smn.station ?? ""}</p>
    </div>
  `;

  // ?? Meteostat
  container.innerHTML += `
    <div class="api-card">
      <h3>Meteostat</h3>
      <p>${data.extra.meteostat.desc}</p>
    </div>
  `;
}
</script>
